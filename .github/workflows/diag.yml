name: diag
on:
  push:
    paths: [".github/workflows/diag.yml"]
jobs:
  hola:
    runs-on: ubuntu-latest
    steps:
      - run: test -n "$SMTP_USER" && echo "secrets OK" || echo "secrets VACIOS"
